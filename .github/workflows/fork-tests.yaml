name: Fork Tests

# Upstream's `unit-tests.yaml` runs the git-crypt encrypted `__tests__/` suite
# on a private VM with No-Instructions' secrets, so it cannot run here. This
# covers the patches this fork carries on top of upstream.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fork-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.x'
        cache: npm
    - run: npm ci
    - run: npm run test:fork
