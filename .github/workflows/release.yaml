name: Releases
on:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4
    - name: Determine release tag
      id: tag
      run: |
        RELEASE_TAG="$(date -u +'%Y.%m.%d%H%M%S')"
        RELEASE_NAME="$RELEASE_TAG"

        echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: npm ci
    # Build into dist/ so esbuild.config.mjs stamps RELEASE_TAG into the
    # manifest — with the default out dir (".") it skips the version update
    # to avoid dirtying the checked-in manifest.json, and the release would
    # ship a stale manifest version.
    - run: npm run release -- dist
      env:
        RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
    - name: Generate artifact attestations
      uses: actions/attest@v4
      with:
        subject-path: |
          dist/main.js
          dist/styles.css
          dist/manifest.json
    - uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/main.js,dist/styles.css,dist/manifest.json"
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
